[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framecut"
version = "1.0.0"
description = "Independent Windows desktop video editor"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<6",
  "Pillow>=11,<13",
  "sounddevice>=0.5,<1",
  "faster-whisper>=1.1,<2",
]

[project.gui-scripts]
framecut = "framecut.main_window:main"

[tool.setuptools.packages.find]
include = ["framecut*"]
